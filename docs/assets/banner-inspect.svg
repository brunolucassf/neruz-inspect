    <rect x="343" y="266" width="12" height="12" rx="2" fill="none" stroke="#A6B5C5" stroke-width="1.5"/>
    <rect x="370" y="259" width="26" height="26" rx="2" fill="none" stroke="#304256"/>
    <rect x="377" y="266" width="12" height="12" rx="2" fill="none" stroke="#A6B5C5" stroke-width="1.5"/>
    <rect class="ind" x="139" y="288" width="12" height="2" fill="#FF4FD0"/>
