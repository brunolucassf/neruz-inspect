  <text class="t" x="64" y="150" fill="#FF4FD0" font-size="15" font-weight="600" letter-spacing="3">NERUZ EXTENSIONS · OPEN SOURCE</text>
  <text class="t" x="62" y="210" fill="#F4F8FC" font-size="58" font-weight="700">Neruz Inspect</text>
  <text class="t" x="64" y="254" fill="#A6B5C5" font-size="21">Veja como qualquer site foi feito.</text>
  <text class="t" x="64" y="284" fill="#A6B5C5" font-size="21">Cores, fontes, medidas e tecnologias. Grátis e local.</text>
  <g transform="translate(64 322)">
    <rect width="96" height="30" rx="2" fill="none" stroke="#304256"/>
