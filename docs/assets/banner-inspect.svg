    <rect x="270" width="112" height="30" rx="2" fill="none" stroke="#304256"/>
    <text class="t" x="326" y="20" fill="#F4F8FC" font-size="13" text-anchor="middle">pt · en · es</text>
  </g>

  <g transform="translate(656 80)">
    <rect class="frame" x="1" y="1" width="546" height="318" rx="6"/>
    <rect width="548" height="28" rx="6" fill="#141D29"/>
    <rect y="20" width="548" height="8" fill="#141D29"/>
