<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Neruz Inspect: veja como qualquer site foi feito">
  <style>
    .t{font-family:"Segoe UI",Helvetica,Arial,sans-serif}
    .tick{stroke:#1f2b3a;stroke-width:1}
    .frame{fill:#0E1520;stroke:#304256;stroke-width:2}
    .blk{fill:#1a2738}
    .scan{animation:scan 6s cubic-bezier(.65,0,.35,1) infinite}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    .ind{animation:ind 8s linear infinite}
    .cota{animation:cota 6s ease-in-out infinite}
    .blink{animation:blink 1.4s ease-in-out infinite}
    @keyframes scan{0%{transform:translateY(28px);opacity:0}10%{opacity:1}88%{transform:translateY(300px);opacity:1}100%{transform:translateY(300px);opacity:0}}
    @keyframes pulse{50%{opacity:.35}}
    @keyframes ind{0%,10%{transform:translateX(0)}12%,22%{transform:translateX(34px)}24%,34%{transform:translateX(68px)}36%,46%{transform:translateX(102px)}48%,58%{transform:translateX(136px)}60%,70%{transform:translateX(170px)}72%,82%{transform:translateX(204px)}84%,94%{transform:translateX(238px)}100%{transform:translateX(0)}}
    @keyframes cota{0%,20%{opacity:0}35%,85%{opacity:1}100%{opacity:0}}
    @keyframes blink{50%{opacity:.25}}
    @media (prefers-reduced-motion:reduce){.scan{animation:none;opacity:0}.pulse,.ind,.blink{animation:none}.cota{animation:none;opacity:1}}
  </style>
  <defs>
    <clipPath id="ip"><rect x="0" y="28" width="548" height="292"/></clipPath>
  </defs>

  <rect width="1280" height="440" fill="#080D14"/>
